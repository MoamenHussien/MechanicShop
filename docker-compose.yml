services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-CU14-ubuntu-22.04
    pull_policy: if_not_present
    container_name: mechanicshop-db
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "${SA_PASSWORD}"
      MSSQL_PID: "Developer"
    env_file:
      - path: .env
        required: false
    ports:
      - "127.0.0.1:1433:1433"
    volumes:
      - sqlserver-data:/var/opt/mssql
    mem_limit: 900m
    mem_reservation: 600m
    cpus: 1.0
    restart: unless-stopped
    init: true
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$${SA_PASSWORD}\" -Q \"SELECT 1\" -C || /opt/mssql-tools/bin/sqlcmd -S localhost -U sa -P \"$${SA_PASSWORD}\" -Q \"SELECT 1\""]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - mechanicshop-network


  seq:
    image: datalust/seq:2024.3
    pull_policy: if_not_present
    container_name: mechanicshop-seq
    environment:
      ACCEPT_EULA: "Y"
    ports:
       - "127.0.0.1:8081:80"
    volumes:
      - seq-data:/data
    mem_limit: 200m
    mem_reservation: 120m
    cpus: 0.25
    restart: unless-stopped
    init: true
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'cat < /dev/null > /dev/tcp/127.0.0.1/80' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - mechanicshop-network

  api:
    build:
      context: .
      dockerfile: Dockerfile
      pull: true
    pull_policy: build
    container_name: mechanicshop-api
    environment:
      ASPNETCORE_ENVIRONMENT: "Production"
      ASPNETCORE_URLS: "http://0.0.0.0:8080"
      ConnectionStrings__DefaultConnection: "Server=sqlserver,1433;Database=MechanicShop;User Id=sa;Password=${SA_PASSWORD};TrustServerCertificate=True;MultipleActiveResultSets=true;"
      Serilog__WriteTo__1__Args__serverUrl: "http://seq:5341"
      ConnectionStrings__Redis: "redis:6379"
      JwtSettings__SecretKey: "${JWT_SECRET_KEY}"
      MailSettings__Username: "${MAIL_USERNAME}"
      MailSettings__Password: "${MAIL_PASSWORD}"
    env_file:
      - path: .env
        required: false
    ports:
      - "5001:8080"
    volumes:
      - dataprotection-keys:/home/app/.aspnet/DataProtection-Keys
    mem_limit: 400m
    mem_reservation: 250m
    cpus: 1.0
    restart: unless-stopped
    init: true
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'cat < /dev/null > /dev/tcp/127.0.0.1/8080' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 60s
    depends_on:
      sqlserver:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - mechanicshop-network

  redis:
    image: redis:7.4-alpine
    pull_policy: if_not_present
    container_name: mechanicshop-redis
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis-data:/data
    mem_limit: 128m
    mem_reservation: 64m
    cpus: 0.25
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    restart: unless-stopped
    init: true
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3
    networks:
      - mechanicshop-network

networks:
  mechanicshop-network:
    driver: bridge

volumes:
  sqlserver-data:
  redis-data:
  seq-data:
  dataprotection-keys:
