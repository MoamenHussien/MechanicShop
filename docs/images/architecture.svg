<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 770" width="1200" height="770" style="background-color: #FAFAFA; font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, sans-serif;">
  <defs>
    <filter id="shadow" x="-4%" y="-4%" width="108%" height="108%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0F172A" flood-opacity="0.06"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#475569" />
    </marker>
    <marker id="arrow-gold" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#CA8A04" />
    </marker>
  </defs>

  <!-- Title & Subtitle -->
  <text x="600" y="38" text-anchor="middle" font-size="22" font-weight="700" fill="#0F172A">🚗 MechanicShop Architecture Overview</text>
  <text x="600" y="60" text-anchor="middle" font-size="12" font-weight="700" fill="#475569">ASP.NET Core • Clean Architecture • CQRS • Docker • Observability</text>

  <!-- Layer 1: Presentation -->
  <g transform="translate(50, 80)">
    <rect width="1100" height="105" rx="10" fill="#EFF6FF" stroke="#93C5FD" stroke-width="1.5" filter="url(#shadow)"/>
    <rect width="1100" height="32" rx="10" fill="#DBEAFE"/>
    <text x="20" y="21" font-size="13" font-weight="700" fill="#1E40AF">1. PRESENTATION LAYER (Blazor WebAssembly Standalone)</text>

    <!-- Cards -->
    <g transform="translate(180, 45)">
      <rect width="320" height="46" rx="8" fill="#FFFFFF" stroke="#BFDBFE" stroke-width="1"/>
      <text x="160" y="20" text-anchor="middle" font-size="13" font-weight="700" fill="#1E293B">Blazor WASM UI</text>
      <text x="160" y="36" text-anchor="middle" font-size="11" fill="#64748B">Interactive SPA Dashboard</text>
    </g>

    <g transform="translate(600, 45)">
      <rect width="320" height="46" rx="8" fill="#FFFFFF" stroke="#BFDBFE" stroke-width="1"/>
      <text x="160" y="20" text-anchor="middle" font-size="13" font-weight="700" fill="#1E293B">SignalR Notifications</text>
      <text x="160" y="36" text-anchor="middle" font-size="11" fill="#64748B">Real-Time Event Listener</text>
    </g>
  </g>

  <!-- Arrow 1 -> 2 -->
  <line x1="600" y1="185" x2="600" y2="210" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="540" y="190" width="120" height="16" rx="4" fill="#E2E8F0"/>
  <text x="600" y="202" text-anchor="middle" font-size="10" font-weight="700" fill="#334155">HTTP REST / SignalR</text>

  <!-- Layer 2: API Layer -->
  <g transform="translate(50, 215)">
    <rect width="1100" height="105" rx="10" fill="#F3E8FF" stroke="#C084FC" stroke-width="1.5" filter="url(#shadow)"/>
    <rect width="1100" height="32" rx="10" fill="#E9D5FF"/>
    <text x="20" y="21" font-size="13" font-weight="700" fill="#6B21A8">2. API LAYER (ASP.NET Core Host)</text>

    <!-- Cards -->
    <g transform="translate(60, 45)">
      <rect width="280" height="46" rx="8" fill="#FFFFFF" stroke="#E9D5FF" stroke-width="1"/>
      <text x="140" y="20" text-anchor="middle" font-size="13" font-weight="700" fill="#1E293B">ASP.NET Core API</text>
      <text x="140" y="36" text-anchor="middle" font-size="11" fill="#64748B">RESTful Endpoints &amp; Routing</text>
    </g>

    <g transform="translate(410, 45)">
      <rect width="280" height="46" rx="8" fill="#FFFFFF" stroke="#E9D5FF" stroke-width="1"/>
      <text x="140" y="20" text-anchor="middle" font-size="13" font-weight="700" fill="#1E293B">JWT Authentication</text>
      <text x="140" y="36" text-anchor="middle" font-size="11" fill="#64748B">Tokens &amp; HttpOnly Cookies</text>
    </g>

    <g transform="translate(760, 45)">
      <rect width="280" height="46" rx="8" fill="#FFFFFF" stroke="#E9D5FF" stroke-width="1"/>
      <text x="140" y="20" text-anchor="middle" font-size="13" font-weight="700" fill="#1E293B">Scalar API UI</text>
      <text x="140" y="36" text-anchor="middle" font-size="11" fill="#64748B">OpenAPI Documentation</text>
    </g>
  </g>

  <!-- Arrow 2 -> 3 -->
  <line x1="600" y1="320" x2="600" y2="345" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="540" y="325" width="120" height="16" rx="4" fill="#E2E8F0"/>
  <text x="600" y="337" text-anchor="middle" font-size="10" font-weight="700" fill="#334155">CQRS Pipeline</text>

  <!-- Layer 3: Application & Domain -->
  <g transform="translate(50, 350)">
    <rect width="1100" height="105" rx="10" fill="#F0FDF4" stroke="#86EFAC" stroke-width="1.5" filter="url(#shadow)"/>
    <rect width="1100" height="32" rx="10" fill="#DCFCE7"/>
    <text x="20" y="21" font-size="13" font-weight="700" fill="#166534">3. APPLICATION &amp; DOMAIN LAYER (Clean Architecture + CQRS)</text>

    <!-- Cards -->
    <g transform="translate(60, 45)">
      <rect width="280" height="46" rx="8" fill="#FFFFFF" stroke="#BBF7D0" stroke-width="1"/>
      <text x="140" y="20" text-anchor="middle" font-size="13" font-weight="700" fill="#1E293B">MediatR CQRS</text>
      <text x="140" y="36" text-anchor="middle" font-size="11" fill="#64748B">Commands &amp; Queries</text>
    </g>

    <g transform="translate(410, 45)">
      <rect width="280" height="46" rx="8" fill="#FFFFFF" stroke="#BBF7D0" stroke-width="1"/>
      <text x="140" y="20" text-anchor="middle" font-size="13" font-weight="700" fill="#1E293B">MediatR Pipeline</text>
      <text x="140" y="36" text-anchor="middle" font-size="11" fill="#64748B">Validation • Logging • Performance</text>
    </g>

    <g transform="translate(760, 45)">
      <rect width="280" height="46" rx="8" fill="#FFFFFF" stroke="#BBF7D0" stroke-width="1"/>
      <text x="140" y="20" text-anchor="middle" font-size="13" font-weight="700" fill="#1E293B">Domain Core</text>
      <text x="140" y="36" text-anchor="middle" font-size="11" fill="#64748B">Entities &amp; Domain Events</text>
    </g>
  </g>

  <!-- Arrow 3 -> 4 -->
  <line x1="600" y1="455" x2="600" y2="480" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="535" y="460" width="130" height="16" rx="4" fill="#E2E8F0"/>
  <text x="600" y="472" text-anchor="middle" font-size="10" font-weight="700" fill="#334155">Persistence &amp; Cache</text>

  <!-- Layer 4: Infrastructure -->
  <g transform="translate(50, 485)">
    <rect width="1100" height="115" rx="10" fill="#FEF3C7" stroke="#FDE047" stroke-width="1.5" filter="url(#shadow)"/>
    <rect width="1100" height="32" rx="10" fill="#FEF08A"/>
    <text x="20" y="21" font-size="13" font-weight="700" fill="#854D0E">4. INFRASTRUCTURE &amp; DATA LAYER (Persistence, Caching &amp; Real-Time Engine)</text>

    <!-- Cards -->
    <g transform="translate(30, 48)">
      <rect width="160" height="48" rx="8" fill="#FFFFFF" stroke="#FEF08A" stroke-width="1"/>
      <text x="80" y="20" text-anchor="middle" font-size="13" font-weight="700" fill="#1E293B">EF Core 10</text>
      <text x="80" y="36" text-anchor="middle" font-size="11" fill="#64748B">ORM Data Mapper</text>
    </g>

    <!-- Arrow EF Core -> SQL Server -->
    <line x1="190" y1="72" x2="225" y2="72" stroke="#CA8A04" stroke-width="2" marker-end="url(#arrow-gold)"/>

    <g transform="translate(230, 48)">
      <rect width="190" height="48" rx="8" fill="#FEF08A" stroke="#EAB308" stroke-width="1"/>
      <text x="95" y="20" text-anchor="middle" font-size="13" font-weight="700" fill="#1E293B">🗄 SQL Server 2022</text>
      <text x="95" y="36" text-anchor="middle" font-size="11" fill="#854D0E">Relational DB Container</text>
    </g>

    <g transform="translate(450, 48)">
      <rect width="210" height="48" rx="8" fill="#FFFFFF" stroke="#FEF08A" stroke-width="1"/>
      <text x="105" y="20" text-anchor="middle" font-size="13" font-weight="700" fill="#1E293B">⚡ HybridCache</text>
      <text x="105" y="36" text-anchor="middle" font-size="11" fill="#64748B">L1 Memory + L2 Redis</text>
    </g>

    <g transform="translate(690, 48)">
      <rect width="180" height="48" rx="8" fill="#FFFFFF" stroke="#FEF08A" stroke-width="1"/>
      <text x="90" y="20" text-anchor="middle" font-size="13" font-weight="700" fill="#1E293B">SignalR Hub</text>
      <text x="90" y="36" text-anchor="middle" font-size="11" fill="#64748B">Server Push Engine</text>
    </g>

    <g transform="translate(890, 48)">
      <rect width="180" height="48" rx="8" fill="#FFFFFF" stroke="#FEF08A" stroke-width="1"/>
      <text x="90" y="20" text-anchor="middle" font-size="13" font-weight="700" fill="#1E293B">Background Jobs</text>
      <text x="90" y="36" text-anchor="middle" font-size="11" fill="#64748B">Hosted Worker Services</text>
    </g>
  </g>

  <!-- Arrow 4 -> 5 -->
  <line x1="600" y1="600" x2="600" y2="625" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="535" y="605" width="130" height="16" rx="4" fill="#E2E8F0"/>
  <text x="600" y="617" text-anchor="middle" font-size="10" font-weight="700" fill="#334155">Telemetry &amp; Logs</text>

  <!-- Layer 5: Observability -->
  <g transform="translate(50, 630)">
    <rect width="1100" height="105" rx="10" fill="#ECFDF5" stroke="#6EE7B7" stroke-width="1.5" filter="url(#shadow)"/>
    <rect width="1100" height="32" rx="10" fill="#A7F3D0"/>
    <text x="20" y="21" font-size="13" font-weight="700" fill="#065F46">5. OBSERVABILITY STACK (Monitoring, Logs &amp; Distributed Tracing Containers)</text>

    <!-- Cards -->
    <g transform="translate(60, 45)">
      <rect width="280" height="46" rx="8" fill="#FFFFFF" stroke="#A7F3D0" stroke-width="1"/>
      <text x="140" y="20" text-anchor="middle" font-size="13" font-weight="700" fill="#1E293B">📝 Seq Log Server</text>
      <text x="140" y="36" text-anchor="middle" font-size="11" fill="#64748B">Structured Serilog Logging</text>
    </g>

    <g transform="translate(410, 45)">
      <rect width="280" height="46" rx="8" fill="#FFFFFF" stroke="#A7F3D0" stroke-width="1"/>
      <text x="140" y="20" text-anchor="middle" font-size="13" font-weight="700" fill="#1E293B">📈 Prometheus &amp; Grafana</text>
      <text x="140" y="36" text-anchor="middle" font-size="11" fill="#64748B">Real-Time Metrics Dashboards</text>
    </g>

    <g transform="translate(760, 45)">
      <rect width="280" height="46" rx="8" fill="#FFFFFF" stroke="#A7F3D0" stroke-width="1"/>
      <text x="140" y="20" text-anchor="middle" font-size="13" font-weight="700" fill="#1E293B">🔍 Jaeger Tracing</text>
      <text x="140" y="36" text-anchor="middle" font-size="11" fill="#64748B">OpenTelemetry Traces</text>
    </g>
  </g>
</svg>