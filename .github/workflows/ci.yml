name: CI Pipeline

on:
  push:
    branches:
      - main
      - master
      - develop
      - "feature/**"
      - "chore/**"

  pull_request:
    branches:
      - main
      - master

  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ============================================================================
  # Stage 1: Build, Quality Checks & Tests
  # ============================================================================
  dotnet-ci:
    name: .NET Build & Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup .NET 10 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
          cache: true
          cache-dependency-path: Directory.Packages.props

      - name: Restore Dependencies
        run: dotnet restore MechanicShop.slnx

      - name: Verify Analyzer Rules
        run: dotnet format analyzers MechanicShop.slnx --verify-no-changes

      - name: Audit NuGet Vulnerabilities
        run: dotnet list package --vulnerable --include-transitive

      - name: Build Solution
        run: dotnet build MechanicShop.slnx --configuration Release --no-restore

      - name: Run Unit Tests
        env:
          JwtSettings__SecretKey: ${{ secrets.JWT_SECRET_KEY }}
        run: |
          dotnet test MechanicShop.slnx \
            --configuration Release \
            --no-build \
            --collect:"XPlat Code Coverage"  

  # ============================================================================
  # Stage 2: Docker Verification & Security Scan
  # ============================================================================
  docker-ci:
    name: Docker Build & Security Scan
    runs-on: ubuntu-latest
    needs: dotnet-ci

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Validate Docker Compose Configuration
        run: docker compose config

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker Image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: false
          load: true
          tags: mechanicshop-api:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Scan Docker Image (Trivy)
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: mechanicshop-api:ci
          format: table
          exit-code: "0"
          ignore-unfixed: true
          vuln-type: os,library
          severity: CRITICAL,HIGH